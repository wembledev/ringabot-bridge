#cloud-config
# Same flow as deploy/stackscript.sh for clouds other than Linode.
# Fill /etc/ringabot/ringabot.env on the host. This file ships no secrets.
package_update: true
packages:
  - baresip
  - pulseaudio
  - python3
  - ca-certificates
  - curl
  - git
  - openssl
  - ufw
  - unattended-upgrades
  - caddy
users:
  - name: ringabot
    system: true
    home: /var/lib/ringabot
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/ringabot/ringabot.env
    owner: ringabot:ringabot
    permissions: "0600"
    content: |
      XAI_API_KEY=
      XAI_VOICE_MODEL=grok-voice-latest
      XAI_VOICE=aurora
      VOIPMS_SIP_SERVER=
      VOIPMS_SIP_USER=
      VOIPMS_SIP_PASSWORD=
      VOIPMS_DID=
      PERSONA_NAME=Example Assistant
      PERSONA_INSTRUCTIONS=Be brief and polite.
      GREETING=
      TOOLS_WEBHOOK_URL=
      TOOLS_WEBHOOK_SECRET=
      API_TOKEN=
      PUBLIC_HOSTNAME=
      INBOUND_MODE=off
      RECORDINGS=off
      RETENTION_DAYS=30
      ALLOWED_DESTINATIONS=+1
      MAX_CALLS_PER_DAY=20
      MAX_CONCURRENT_CALLS=4
      HOST=127.0.0.1
      PORT=8787
      DATA_DIR=/var/lib/ringabot
      AUDIO_MODE=pulse
      RINGABOT_MASTER_KEY_FILE=/etc/ringabot/master.key
  - path: /etc/systemd/system/ringabot.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Ringabot bridge
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=ringabot
      Group=ringabot
      EnvironmentFile=/etc/ringabot/ringabot.env
      Environment=XDG_RUNTIME_DIR=/run/ringabot
      RuntimeDirectory=ringabot
      WorkingDirectory=/opt/ringabot
      ExecStartPre=/usr/bin/pulseaudio -D --exit-idle-time=-1
      ExecStart=/opt/ringabot/.venv/bin/ringabot serve
      Restart=on-failure
      RestartSec=2
      UMask=0077
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/lib/ringabot
      MemoryMax=800M
      LimitNOFILE=4096
      SystemCallArchitectures=native

      [Install]
      WantedBy=multi-user.target
runcmd:
  - install -d -o ringabot -g ringabot -m 0750 /var/lib/ringabot /opt/ringabot /etc/ringabot
  - openssl rand -out /etc/ringabot/master.key 32
  - chown ringabot:ringabot /etc/ringabot/master.key
  - chmod 0400 /etc/ringabot/master.key
  - python3 -c "import secrets, pathlib; p=pathlib.Path('/etc/ringabot/ringabot.env'); t=p.read_text();
token=secrets.token_hex(32);
t=t.replace('API_TOKEN=','API_TOKEN=%s'%token,1); p.write_text(t);
c=pathlib.Path('/root/ringabot-credentials.txt'); c.write_text('API_URL=http://127.0.0.1:8787/mcp\nAPI_TOKEN=%s\n'%token); c.chmod(0o600)"
  - chmod 0600 /etc/ringabot/ringabot.env
  - chown ringabot:ringabot /etc/ringabot/ringabot.env
  - bash -c "curl -LsSf https://astral.sh/uv/install.sh | sh && install -m 0755 /root/.local/bin/uv /usr/local/bin/uv"
  - bash -c "if [ -n \"${RINGABOT_TARBALL_URL:-}\" ]; then test -n \"${RINGABOT_SHA256:-}\" && curl -fsSL \"$RINGABOT_TARBALL_URL\" -o /tmp/ringabot.tar.gz && echo \"$RINGABOT_SHA256  /tmp/ringabot.tar.gz\" | sha256sum -c - && tar -xzf /tmp/ringabot.tar.gz -C /opt/ringabot --strip-components=1; else git clone --depth 1 --branch \"${RINGABOT_REF:-main}\" \"${RINGABOT_GIT_URL:-https://github.com/wembledev/ringabot-bridge.git}\" /opt/ringabot; fi"
  - chown -R ringabot:ringabot /opt/ringabot
  - sudo -u ringabot -H uv sync --frozen --no-dev --project /opt/ringabot
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl daemon-reload
  - systemctl enable --now ringabot
